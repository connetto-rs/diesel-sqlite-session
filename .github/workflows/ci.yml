name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Check formatting
  fmt:
    name: Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Fail fast when the committed lockfile drifts from the manifests. Most jobs
  # resolve without `--locked` and silently rewrite Cargo.lock instead, so only
  # a handful of cross-target jobs would otherwise catch the drift.
  lockfile:
    name: Lockfile
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo.lock matches the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

  # Run clippy lints
  clippy:
    name: Clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run tests
        run: cargo test --verbose
      - name: Check benchmarks compile
        run: cargo test --benches --no-run

  # WASM tests, against both `sqlite-wasm-rs` releases the crate accepts
  wasm:
    name: WASM Tests (sqlite-wasm-rs ${{ matrix.sqlite-wasm-rs }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        sqlite-wasm-rs: ["0.6", "0.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sqlite-wasm-rs-${{ matrix.sqlite-wasm-rs }}

      # 0.5 has no `wasm-bindgen` feature, and Cargo resolves the lockfile with
      # every workspace feature enabled, so no committed manifest accepts both
      # releases. The test crates take 0.5 here instead. The `rusqlite`
      # dev-dependency, used only by the native comparison benchmark, requires
      # 0.6.3 or later on wasm, so it leaves the graph too.
      - name: Move the wasm test crates to sqlite-wasm-rs 0.5
        if: matrix.sqlite-wasm-rs == '0.5'
        run: |
          cargo remove --dev -p diesel-sqlite-session rusqlite
          cargo remove -p diesel-sqlite-session-wasm-tests sqlite-wasm-rs
          cargo remove -p diesel-sqlite-session-wasm-bench sqlite-wasm-rs
          cargo add -p diesel-sqlite-session-wasm-tests sqlite-wasm-rs@0.5
          cargo add -p diesel-sqlite-session-wasm-bench sqlite-wasm-rs@0.5

      - name: Confirm the resolved sqlite-wasm-rs release
        run: |
          cargo tree -p diesel-sqlite-session --target wasm32-unknown-unknown \
            -i sqlite-wasm-rs --depth 0 \
            | tee /dev/stderr | grep -q "^sqlite-wasm-rs v${{ matrix.sqlite-wasm-rs }}\."

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-chromedriver: true

      # ChromeDriver resolves the runner's preinstalled `google-chrome` ahead of
      # the Chrome for Testing build on `PATH`, and the resulting version
      # mismatch fails session creation. Name the binary explicitly.
      - name: Pin the browser binary for webdriver
        run: |
          printf '{"goog:chromeOptions":{"binary":"%s"}}\n' \
            "${{ steps.setup-chrome.outputs.chrome-path }}" \
            > "${{ runner.temp }}/webdriver.json"

      # `wasm-pack` overwrites `CHROMEDRIVER` with whatever it resolves itself,
      # so the driver has to arrive as an argument.
      - name: Run WASM tests (headless Chrome)
        run: |
          cd wasm-tests
          wasm-pack test --headless --chrome \
            --chromedriver "${{ steps.setup-chrome.outputs.chromedriver-path }}"
        env:
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/webdriver.json

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  # Miri checks for unsafe-heavy internal code paths
  miri:
    name: Miri (Core Unsafe Paths)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Setup Miri
        run: cargo miri setup
      - name: Run Miri on error conversion logic
        run: "cargo miri test -p diesel-sqlite-session --lib errors::"
      - name: Run Miri on apply callback logic
        run: "cargo miri test -p diesel-sqlite-session --lib apply::tests::"

  # AddressSanitizer checks for unsafe-heavy internal code paths
  asan:
    name: ASan (Core Unsafe Paths)
    runs-on: ubuntu-26.04
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Run ASan on apply callback tests
        run: "cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p diesel-sqlite-session --lib apply::tests::"

  # Check that the crate builds for WASM target
  wasm-build:
    name: WASM Build Check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build for WASM
        run: cargo build --target wasm32-unknown-unknown -p diesel-sqlite-session

  # Native runtime tests on ARM64 Linux runners.
  linux-arm64:
    name: Linux ARM64 Runtime Tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify host architecture
        run: rustc -vV
      - name: Run tests
        run: cargo test -p diesel-sqlite-session --verbose --locked
      - name: Check benchmarks compile
        run: cargo test -p diesel-sqlite-session --benches --no-run --locked

  # Cross-target link/build check for aarch64 musl.
  edge-musl-link-check:
    name: Edge Cross Link Check (aarch64-unknown-linux-musl)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cross
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cross
      - name: Cross test build (no-run, musl)
        run: |
          cross test \
            --target aarch64-unknown-linux-musl \
            -p diesel-sqlite-session \
            --no-run \
            --locked

  # ARMv7 link check using host cross toolchain (avoids old glibc in cross images).
  armv7-link-check:
    name: ARMv7 Link Check
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install ARMv7 cross-linker
        run: |
          # GitHub Ubuntu images can ship an Azure CLI apt source that
          # intermittently returns 403 and breaks apt-get update.
          if [ -f /etc/apt/sources.list.d/azure-cli.list ]; then
            sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross
      - name: ARMv7 test build (no-run)
        run: cargo test -p diesel-sqlite-session --target armv7-unknown-linux-gnueabihf --no-run --locked
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          CFLAGS_armv7_unknown_linux_gnueabihf: --sysroot=/usr/arm-linux-gnueabihf

  # Coverage (optional, can be commented out if not needed)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  required:
    name: Required Checks
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    needs:
      - fmt
      - lockfile
      - clippy
      - test
      - wasm
      - docs
      - miri
      - asan
      - wasm-build
      - linux-arm64
      - edge-musl-link-check
      - armv7-link-check
      - coverage
    steps:
      - name: Verify required job status
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "${NEEDS_JSON}" | jq -C .
          echo "${NEEDS_JSON}" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
